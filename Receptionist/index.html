        <!-- Main Content -->
        <main class="main">

            <h1>Welcome, Receptionist 👋</h1>
            <p>Manage patients and appointments here.</p>

            <div class="cards">

                <!-- Register Patient -->
                <div class="card">
                    <h3>Register Patient</h3>
                    <p>Register new patients in the clinic.</p>
                    <button onclick="window.location.href='register.html'">
                        Register Patient
                    </button>
                </div>

                <!-- View Patients -->
                <div class="card">
                    <h3>View All Patients</h3>
                    <p>View all registered patients.</p>
                    <button onclick="window.location.href='view_patients.html'">
                        View Patients
                    </button>
                </div>

                <!-- Search Patient -->
                <div class="card">
                    <h3>Search Patient</h3>
                    <p>Search by MMR number or mobile.</p>
                    <button onclick="window.location.href='search.html'">
                        Search Patient
                    </button>
                </div>

                <!-- Check Doctors -->
                <div class="card">
                    <h3>View Appointments</h3>
                    <p>View available doctors and departments.</p>
                    <button onclick="window.location.href='view_appointment.html'">
                        Check Doctors
                    </button>
                </div>

            </div>
        </main>

    </div>
