
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Medicines</title>
    <link rel="stylesheet" href="pharmacist.css">
</head>
<body data-page="medicines">

    <nav class="navbar">
        <h2>CMS - Pharmacy</h2>

        <div class="nav-links">
            <a href="pharmacist.html">Dashboard</a>
            <a href="medicines.html" class="active">Manage Medicines</a>
        </div>
    </nav>

    <main class="container">

        <div class="page-heading">
            <div>
                <h1>Medicine Management</h1>
                <p>Add, update and manage medicines.</p>
            </div>
        </div>

        <!-- Add Medicine Form -->
        <section class="panel">

            <h2 id="formTitle">Add New Medicine</h2>

            <form id="medicineForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="medicineName">Medicine Name</label>
                        <input type="text" id="medicineName" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Tablet">Tablet</option>
                            <option value="Capsule">Capsule</option>
                            <option value="Syrup">Syrup</option>
                            <option value="Injection">Injection</option>
                            <option value="Ointment">Ointment</option>
                            <option value="Drops">Drops</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="strength">Strength</label>
                        <input type="text" id="strength"
                               placeholder="Example: 500 mg" required>
                    </div>

                    <div class="form-group">
                        <label for="batchNumber">Batch Number</label>
                        <input type="text" id="batchNumber" required>
                    </div>

                    <div class="form-group">
                        <label for="expiryDate">Expiry Date</label>
                        <input type="date" id="expiryDate" required>
                    </div>

                    <div class="form-group">
                        <label for="price">Price Per Unit (₹)</label>
                        <input type="number" id="price"
                               min="0.01" step="0.01" required>
                    </div>

                    <!-- ONLY ONE QUANTITY FIELD -->
                    <div class="form-group">
                        <label for="quantity">Available Quantity</label>
                        <input type="number" id="quantity"
                               min="0" step="1" required>
                    </div>

                </div>

                <div class="button-row">

                    <button type="submit" class="btn-standard" id="submitBtn">
                        Add Medicine
                    </button>

                    <button type="button" class="btn-cancel"
                            id="cancelBtn" hidden>
                        Cancel
                    </button>

                </div>

            </form>

        </section>

        <!-- Medicine List -->
        <section class="panel">

            <div class="panel-title-row">
                <h2>Medicine List</h2>
                <span id="medicineCount">0 medicines</span>
            </div>

            <div class="table-bar">

                <div class="form-group search-group">
                    <label for="searchMedicine">Search Medicine</label>
                    <input type="text" id="searchMedicine"
                           placeholder="Search by name or batch number">
                </div>

                <div class="form-group filter-group">
                    <label for="statusFilter">Filter by Status</label>

                    <select id="statusFilter">
                        <option value="All">All Medicines</option>
                        <option value="Available">Available</option>
                        <option value="Out of Stock">Out of Stock</option>
                        <option value="Expired">Expired</option>
                    </select>
                </div>

            </div>

            <div class="table-container">

                <table class="grid-table">

                    <thead>
                        <tr>
                            <th>Medicine Name</th>
                            <th>Category</th>
                            <th>Strength</th>
                            <th>Batch Number</th>
                            <th>Expiry Date</th>
                            <th>Price (₹)</th>
                            <th>Available Quantity</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="medicineTable">
                        <tr>
                            <td colspan="9">No medicines added yet.</td>
                        </tr>
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="pharmacist.js"></script>
</body>
</html>
